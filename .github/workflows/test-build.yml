name: Test build

# Builds a signed Android APK from any branch, without a tag or a release,
# to try changes on a phone before publishing them. Run it from the
# Actions tab ("Run workflow"); the APK is attached to the run as an
# artifact for 14 days. It is signed with the release key, so it installs
# over a released V360Lab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (signed test APK)
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::Missing ANDROID_KEY_BASE64 secret: the APK cannot be signed."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action's default package list includes "tools", which recent
      # sdkmanager versions no longer provide; install only what we need.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the Android platform and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Write the signing configuration
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        run: npx tauri android build --apk

      - name: Name the APK after the version and commit
        id: apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          case "$APK" in *unsigned*) echo "::error::APK is not signed: $APK"; exit 1 ;; esac
          VERSION=$(node -p "require('./package.json').version")
          NAME="V360Lab_${VERSION}-test-${GITHUB_SHA::7}_android_universal.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14
