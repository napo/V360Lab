name: Release

# Builds and publishes V360Lab for Windows, Linux and Android.
# Triggered by pushing a tag such as v0.2.0, or manually (uses the version
# in package.json as the tag). A manual run can rebuild only the Android APK
# and attach it to the existing release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      android_only:
        description: Only build the Android APK
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Determine tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The tag must match package.json, Cargo.toml and tauri.conf.json.
          node scripts/check-version.mjs "$TAG"

      - name: Create the GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            # Notes: this version's CHANGELOG section, then the generic notes.
            VERSION="${TAG#v}"
            {
              echo "## What's new"
              awk -v v="$VERSION" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md
              echo
              cat .github/release-notes.md
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --target "$GITHUB_SHA" --title "V360Lab $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: create-release
    if: ${{ !inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Builds the installers (Windows: .msi and .exe; Linux: .deb, .rpm,
      # .AppImage), signs the update artifacts with the updater key, and
      # uploads them to the release with latest.json, which installed apps
      # read to update themselves (src-tauri/tauri.conf.json, plugins.updater).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: V360Lab ${{ needs.create-release.outputs.tag }}
          releaseBody: ""
          releaseDraft: false
          prerelease: false

  android:
    name: Android (signed APK)
    needs: create-release
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::Missing ANDROID_KEY_BASE64 secret: the APK cannot be signed."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action's default package list includes "tools", which recent
      # sdkmanager versions no longer provide; install only what we need.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the Android platform and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Write the signing configuration
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri android build --apk

      - name: Upload the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          case "$APK" in *unsigned*) echo "::error::APK is not signed: $APK"; exit 1 ;; esac
          cp "$APK" "V360Lab_${VERSION}_android_universal.apk"
          gh release upload "$TAG" "V360Lab_${VERSION}_android_universal.apk" --clobber
