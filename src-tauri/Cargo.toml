[package]
name = "v360lab"
version = "0.4.0"
description = "Open-source toolkit for Garmin VIRB 360 video, telemetry and computer vision."
authors = ["Maurizio Napolitano"]
repository = "https://github.com/napo/V360Lab"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.82"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "v360lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "net"] }
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2"
base64 = "0.22"
if-addrs = "0.15.0"
socket2 = "0.6"
percent-encoding = "2"
tract-onnx = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
tempfile = "3"

# Keep debug builds small: no debug info for dependencies (Tauri pulls in
# ~500 crates), line tables only for V360Lab itself.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Object detection runs ~5× faster with the inference engine optimised:
# keep it fast in development builds too.
[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.tract-onnx]
opt-level = 3

[profile.dev.package.tract-hir]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3
